name: infillo

services:
  db:
    image: postgres:17
    container_name: infillo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infillo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infillo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-infillo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infillo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: infillo-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # mail preview in the browser
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP for the API

volumes:
  db-data: